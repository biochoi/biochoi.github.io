# 섹션을 추가하려면 아래 목록에 블록을 하나 더 붙이면 됩니다.
# 순서를 바꾸려면 블록 위치를 옮기면 됩니다.
# ═══════════════════════════════════════════════════════════

sections:
  - title: Education
    title_ko: 학력
    items:
      - when: "2000.03 – 2005.08"
        what: "Ph.D., Chemical Engineering"
        where: "School of Chemical Engineering, Seoul National University"

      - when: "1998.03 – 2000.02"
        what: "M.S., Chemical Engineering"
        where: "Seoul National University"

      - when: "1994.03 – 1998.02"
        what: "B.S., Chemical Engineering"
        where: "Seoul National University"

  - title: Professional Experience
    title_ko: 경력
    items:
      - when: "2019.09 – present"
        what: "Professor"
        where: "Dept. of Chemical Engineering & Applied Chemistry, Chungnam National University"

      - when: "2015.09 – 2019.08"
