# PI 이력 — People 페이지에 표시됩니다
#
# 구조가 단순합니다. 모든 섹션이 똑같은 형식입니다.
#
#   - title:     섹션 제목 (아무 이름이나 자유롭게)
#     title_ko:  국문 부제 (생략 가능)
