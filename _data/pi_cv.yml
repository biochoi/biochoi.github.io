        where: "Dept. of Biology, University of Texas at Arlington, USA"

      - when: "2011.08 – 2015.08"
        what: "Assistant Professor"
        where: "Dept. of Chemical Engineering & Applied Chemistry, Chungnam National University"

      - when: "2008.03 – 2011.08"
        what: "Research Assistant Professor"
        where: "Dept. of Chemical Engineering, Pohang University of Science & Technology (POSTECH)"

      - when: "2006.03 – 2008.03"
